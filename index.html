<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3초 숫자 기억 테스트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      background-color: #1e1e1e;
      border: 2px solid #333333;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 800px;
      height: auto;
      aspect-ratio: 4 / 3;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- T02-C26, T02-C27: Web Audio API 기반 오디오 시스템 ---
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playBeep(freq, type, duration) {
  if (gameState.isMuted || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

// --- T02-C05: 게임 상태 정의 ---
const STATE = { READY: 0, SHOW: 1, INPUT: 2, SUCCESS: 3, FAIL: 4, PAUSED: 5 };

const gameState = {
  current: STATE.READY,
  previousState: STATE.READY,
  targetNumber: 0,
  inputNumber: null,
  timer: 3.0,
  timeLimit: 3.0,
  lastTime: 0,
  isMuted: false,
  isPaused: false,
  stats: {
    highScore: 0,
    playCount: 0,
    successCount: 0
  }
};

// --- T02-C22~C25: LocalStorage 복구 및 저장 관리 ---
const STORAGE_KEY = 'NUM_GAME_STATS_V1';

function loadStats() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    if (!data) throw new Error("Empty data");
    const parsed = JSON.parse(data);
    if (typeof parsed.highScore === 'number' && typeof parsed.playCount === 'number' && typeof parsed.successCount === 'number') {
      gameState.stats = parsed;
    } else {
      throw new Error("Corrupted structure");
    }
  } catch (e) {
    // 빈 값/손상 값 인지 시 기본값 안전 복구
    gameState.stats = { highScore: 0, playCount: 0, successCount: 0 };
    saveStats();
  }
}

function saveStats() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState.stats));
  } catch (e) {}
}

// --- T02-C07, T02-C08, T02-C09: 게임 진행/초기화 로직 ---
function startGame() {
  initAudio();
  gameState.targetNumber = Math.floor(Math.random() * 10);
  gameState.inputNumber = null;
  gameState.timer = gameState.timeLimit;
  gameState.current = STATE.SHOW;
  gameState.isPaused = false;
  playBeep(440, 'sine', 0.1);
}

// --- T02-C06: 조작 반영 ---
function handleInput(num) {
  if (gameState.current !== STATE.INPUT) return;
  gameState.inputNumber = num;
  
  if (gameState.inputNumber === gameState.targetNumber) {
    gameState.current = STATE.SUCCESS;
    gameState.stats.playCount++;
    gameState.stats.successCount++;
    gameState.stats.highScore = Math.max(gameState.stats.highScore, gameState.stats.successCount);
    saveStats();
    playBeep(880, 'sine', 0.2);
  } else {
    gameState.current = STATE.FAIL;
    gameState.stats.playCount++;
    saveStats();
    playBeep(150, 'sawtooth', 0.3);
  }
}

// --- T02-C12: 입력 디바운싱 ---
let lastKeyPressTime = 0;
window.addEventListener('keydown', (e) => {
  const now = performance.now();
  if (now - lastKeyPressTime < 50) return;
  lastKeyPressTime = now;

  if (e.code === 'KeyM') {
    gameState.isMuted = !gameState.isMuted;
    return;
  }

  if (e.code === 'KeyP') {
    togglePause();
    return;
  }

  if (gameState.isPaused) return;

  if (e.code === 'Space') {
    if (gameState.current === STATE.READY || gameState.current === STATE.SUCCESS || gameState.current === STATE.FAIL) {
      startGame();
    }
  } else if (e.key >= '0' && e.key <= '9') {
    handleInput(parseInt(e.key));
  }
});

function togglePause() {
  if (gameState.current === STATE.PAUSED) {
    gameState.current = gameState.previousState;
    gameState.isPaused = false;
  } else if (gameState.current === STATE.SHOW || gameState.current === STATE.INPUT) {
    gameState.previousState = gameState.current;
    gameState.current = STATE.PAUSED;
    gameState.isPaused = true;
  }
}

// --- T02-C14, T02-C15: 포커스 이탈 제어 ---
window.addEventListener('blur', () => {
  if (gameState.current === STATE.SHOW || gameState.current === STATE.INPUT) {
    gameState.previousState = gameState.current;
    gameState.current = STATE.PAUSED;
    gameState.isPaused = true;
  }
});

function update(dt) {
  if (gameState.current === STATE.PAUSED) return;

  if (gameState.current === STATE.SHOW || gameState.current === STATE.INPUT) {
    gameState.timer -= dt;
    if (gameState.timer <= 0) {
      if (gameState.current === STATE.SHOW) {
        gameState.current = STATE.INPUT;
        gameState.timer = gameState.timeLimit;
        playBeep(600, 'sine', 0.1);
      } else if (gameState.current === STATE.INPUT) {
        gameState.current = STATE.FAIL;
        gameState.stats.playCount++;
        saveStats();
        playBeep(150, 'sawtooth', 0.3);
      }
    }
  }
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // T02-C03, T02-C04: 규칙 및 핵심 조작 UI 노출
  ctx.fillStyle = '#aaaaaa';
  ctx.font = '16px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('규칙: 3초간 출력되는 숫자를 기억한 뒤 3초 안에 키보드(0~9)로 입력하세요.', 20, 30);
  ctx.fillText('조작: [Space] 시작/재시작 | [0-9] 숫자입력 | [P] 일시정지 | [M] 음소거', 20, 55);

  ctx.textAlign = 'right';
  ctx.fillText(`음소거: ${gameState.isMuted ? 'ON' : 'OFF'} (M)`, 780, 30);
  ctx.fillText(`기록: ${gameState.stats.successCount}승 / Total ${gameState.stats.playCount}회 (최고 ${gameState.stats.highScore}연승)`, 780, 55);

  ctx.textAlign = 'center';

  if (gameState.current === STATE.READY) {
    ctx.fillStyle = '#4CAF50';
    ctx.font = 'bold 36px sans-serif';
    ctx.fillText('준비되셨나요?', 400, 260);
    ctx.fillStyle = '#ffffff';
    ctx.font = '20px sans-serif';
    ctx.fillText('[Space] 키를 눌러 판을 시작하세요.', 400, 340);
  } else if (gameState.current === STATE.SHOW) {
    ctx.fillStyle = '#FFC107';
    ctx.font = '18px sans-serif';
    ctx.fillText('숫자를 기억하세요!', 400, 200);

    ctx.strokeStyle = '#FFC107';
    ctx.lineWidth = 4;
    ctx.strokeRect(330, 230, 140, 140);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 90px sans-serif';
    ctx.fillText(gameState.targetNumber, 400, 335);

    drawTimerBar('#FFC107');
  } else if (gameState.current === STATE.INPUT) {
    ctx.fillStyle = '#2196F3';
    ctx.font = '18px sans-serif';
    ctx.fillText('기억한 숫자를 키보드로 입력하세요!', 400, 200);

    ctx.strokeStyle = '#2196F3';
    ctx.lineWidth = 4;
    ctx.strokeRect(330, 230, 140, 140);

    ctx.fillStyle = '#888888';
    ctx.font = 'bold 80px sans-serif';
    ctx.fillText('?', 400, 330);

    drawTimerBar('#2196F3');
  } else if (gameState.current === STATE.SUCCESS) {
    ctx.fillStyle = '#4CAF50';
    ctx.font = 'bold 48px sans-serif';
    ctx.fillText('성공! (CLEAR)', 400, 260);
    ctx.fillStyle = '#ffffff';
    ctx.font = '20px sans-serif';
    ctx.fillText(`정답: ${gameState.targetNumber} | [Space] 키를 눌러 다시 시작`, 400, 340);
  } else if (gameState.current === STATE.FAIL) {
    ctx.fillStyle = '#F44336';
    ctx.font = 'bold 48px sans-serif';
    ctx.fillText('실패! (FAIL)', 400, 260);
    ctx.fillStyle = '#ffffff';
    ctx.font = '20px sans-serif';
    ctx.fillText(`정답: ${gameState.targetNumber} | [Space] 키를 눌러 다시 시작`, 400, 340);
  } else if (gameState.current === STATE.PAUSED) {
    ctx.fillStyle = '#FF9800';
    ctx.font = 'bold 40px sans-serif';
    ctx.fillText('일시정지 중 (PAUSED)', 400, 270);
    ctx.fillStyle = '#ffffff';
    ctx.font = '20px sans-serif';
    ctx.fillText('[P] 키를 눌러 게임을 재개하세요.', 400, 330);
  }
}

function drawTimerBar(color) {
  const progress = Math.max(0, gameState.timer / gameState.timeLimit);
  ctx.fillStyle = '#333333';
  ctx.fillRect(250, 410, 300, 16);
  ctx.fillStyle = color;
  ctx.fillRect(250, 410, 300 * progress, 16);
  
  ctx.fillStyle = '#ffffff';
  ctx.font = '14px sans-serif';
  ctx.fillText(`${Math.ceil(gameState.timer)}초 남음`, 400, 450);
}

// --- T02-C16, T02-C17: 루프 구조 ---
function loop(timestamp) {
  if (!gameState.lastTime) gameState.lastTime = timestamp;
  const dt = (timestamp - gameState.lastTime) / 1000;
  gameState.lastTime = timestamp;

  update(dt);
  render();

  requestAnimationFrame(loop);
}

loadStats();
requestAnimationFrame(loop);
</script>
</body>
</html>
